# El modo UHC por muerte. /dreamers DeathUCH lo cambia y guarda estos valores.
death-uhc:
  enabled: false
  seconds: 60

# Comandos que puede usar quien no es op y no tiene dreamers.commands.bypass.
# El tabulador solo ofrece estos. El nombre va sin la barra.
# Un subcomando se escribe aparte: dreamers armor solo deja ese.
# minecraft:tell cuenta como tell. blocked acepta códigos de color &.
commands:
  allowed:
    - tell
    - msg
    - me
    - abandonclaim
    - unclaim
    - trust
    - untrust
    - containertrust
    - accesstrust
    - permissiontrust
    - unlockdrops
    - abandonallclaims
    - givepet
    - trustlist
    - dreamers armor
  blocked: "&cEste comando está bloqueado."

# Visibilidad de la armadura. true se ve y false se oculta.
# /dreamers armor <true|false> cambia la propia. Un operador puede indicar el jugador.
# Con la armadura oculta, al recibir daño se ve durante 5 segundos.
armor:
  players: {}

# Xaero's Minimap. Los allow-* valen para quien no tiene regla propia.
# level-id identifica el servidor ante el mod; no lo cambies.
# /dreamers xm <jugador> <cuevas> <cuevasNether> <radar> guarda true o false para ese jugador.
xaero:
  allow-cave-mode: true
  allow-nether-cave-mode: true
  allow-radar: true
