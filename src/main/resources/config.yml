# El modo UHC por muerte. /dreamers DeathUCH lo cambia y guarda estos valores.
death-uhc:
  enabled: false
  seconds: 60

# Comandos que puede usar quien no es op y no tiene dreamers.commands.bypass.
# El tabulador solo ofrece estos. El nombre va sin la barra.
# Un subcomando se escribe aparte: dreamers armor solo deja ese.
# minecraft:tell cuenta como tell. blocked acepta códigos de color &.
commands:
  allowed:
    - tell
    - msg
    - me
    - dreamers unclaim
    - dreamers trust
    - dreamers untrust
    - dreamers containertrust
    - dreamers accesstrust
    - dreamers permissiontrust
    - dreamers unlockdrops
    - dreamers abandonallclaims
    - dreamers givepet
    - dreamers trustlist
    - dreamers armor
    - dreamers scoreboard_info
  blocked: "&cEste comando está bloqueado."

# Visibilidad de la armadura. true se ve y false se oculta.
# /dreamers armor <true|false> cambia la propia. Un operador puede indicar el jugador.
# Con la armadura oculta, al recibir daño se ve durante 5 segundos.
armor:
  players: {}

# Xaero's Minimap. Los allow-* y track-players valen para quien no tiene regla propia.
# level-id identifica el servidor ante el mod; no lo cambies.
# /dreamers xm <jugador|@a> <cuevas> <cuevasNether> <radar> <trackPlayers> guarda true o false.
# @a incluye a quien ya entró, esté conectado o no. /dreamers xm <jugador|@a> reset borra esa regla.
# track-players muestra a los jugadores en cualquier parte del mapa. El radar no los oculta: solo quita el resto de entidades.
xaero:
  allow-cave-mode: true
  allow-nether-cave-mode: true
  allow-radar: true
  track-players: true

# Distancia de visión por jugador.
# /dreamers viewdistance <jugador|@a> <2-32|reset> la cambia. Solo un operador o la consola.
# reset vuelve a la distancia del servidor. @a ajusta a quien ya entró, esté conectado o no.
# Puede superar la distancia del servidor, hasta 32: el servidor carga y envía esos chunks solo a ese jugador.
# No se avisa al jugador.
viewdistance:
  players: {}

# Botín único. Cofres, cofres trampa, barriles y vagonetas con cofre que aún tienen tabla de botín
# se abren con un inventario por jugador. La tabla se queda en el contenedor.
# destroying.restricted: solo un jugador en creativo puede romperlos.
# destroying.confirmation: ese jugador confirma antes de romperlos.
# auto-replenish vuelve a generar el botín pasado un tiempo al azar, entre minutes-min y minutes-max.
# max-refills cuenta cuántas veces se rellena después de la primera generación. -1 no tiene límite.
# require-emptied exige vaciarlo antes. En false, lo que quedaba se sustituye.
unique-loot:
  enabled: true
  destroying:
    restricted: true
    confirmation: true
  auto-replenish:
    enabled: false
    minutes-min: 720
    minutes-max: 2880
    max-refills: 1
    require-emptied: true

# Fabric Mod Whitelist. Con enabled en true solo entra un operador o un cliente de Clients.
# Check mods revisa la lista de esos clientes: sale quien no la manda o trae un mod que no está admitido.
# La versión no importa y no hace falta traerlos todos.
# minecraft, java, fabricloader y mixinextras se admiten siempre.
# Los mods empaquetados dentro de otro jar no se revisan.
# dreamers-mod-sender tiene que quedarse: es el mod que manda la lista.
fabric-mod-whitelist:
  enabled: true
  # Clients
  clients:
    - vanilla
    - fabric
    - horizon
  # Check mods
  check-mods:
    - fabric
  # Mods admitidos
  allowed:
    - appleskin
    - architectury
    - badoptimizations
    - betterf3
    - c2me
    - chat_heads
    - cloth-config
    - clumps
    - continuity
    - dreamers-mod-sender
    - entityculling
    - fabric-api
    - ferritecore
    - immediatelyfast
    - inventoryhud
    - iris
    - librarian-trade-finder
    - lithium
    - logical_zoom
    - lss
    - modmenu
    - moreculling
    - reeses-sodium-options
    - renderscale
    - roughlyenoughitems
    - scalablelux
    - shulkerboxtooltip
    - sodium
    - sodium-extra
    - vmp
    - voicechat
    - voxy
    - xaerominimap
    - xaeroworldmap

# Terrenos. La pala de oro marca dos esquinas; el costo es ancho por largo. El palo muestra el borde.
# Los claimblocks y los terrenos se guardan en claims.yml.
# initial-blocks se regala la primera vez que el plugin ve al jugador.
# La acumulación solo corre mientras está conectado, hasta maximum. maximum -1 no tiene tope.
# minimum-side es el lado mínimo. combat-seconds es el tiempo de PvP al salir.
# border-seconds es cuánto se ve el borde. enabled-worlds son los mundos donde hay terrenos.
claims:
  initial-blocks: 50
  minimum-side: 5
  border-seconds: 10
  combat-seconds: 15
  enabled-worlds:
    - Dreamers4
  accrual:
    minutes: 60
    blocks: 100
    maximum: 8000

# Tab. La cabecera y el pie dependen del mundo.
# Cada grupo lista sus mundos. default cubre el resto.
# footer: [] en otro grupo usa el pie de default. footer: sin lista no muestra pie. El header no se hereda.
# belowname es el texto bajo el nombre. La distancia es en bloques.
tab:
  belowname: "&c❤ %health%"
  belowname-distance: 32
  designs:
    legacy:
      worlds:
        - Dreamers
        - Dreamers_nether
        - Dreamers_the_end
      header:
        - "&dDreamers &6Legacy"
        - "&bServer Season 1"
      footer: []
    terranova:
      worlds:
        - DreamersTerranova
        - DreamersTerranova_nether
        - DreamersTerranova_the_end
      header:
        - "&dDreamers &6Terranova 2"
        - "&bServer Season 3"
      footer: []
    lobby:
      worlds:
        - DreamersLobby
      header:
        - "&dDreamers &6Lobby"
        - "&Escoge tu mundo a jugar"
      footer: []
    hardcore:
      worlds:
        - DreamersHardcore
        - DreamersHardcore_nether
        - DreamersHardcore_the_end
      header:
        - "&dDreamers &cHardcore"
        - "&bLimite de mundo: 10 mil bloques"
      footer: []
    dreamers3:
      worlds:
        - Dreamers3
      header:
        - "&5&k--- &d&lDreamers 3: &6&lBack to Terranova &5&k---"
        - "&bJava %server_version% &f- &aPong: &f%ping% &b/&r &aTPS: &f%tps%"
      footer: []
    default:
      header:
        - "&5&k--- &d&lDreamers 4.5: &6&lBetter Terranova &5&k---"
        - "&bJava %server_version% &f- &aPong: &f%ping% &b/&r &aTPS: &f%tps%"
      footer:
        - "&bJava/Bedrock IP: &fdreamersjosflix7.ddns.net"

# Login & Logout messages. enabled los activa.
# login y logout aceptan códigos & y %player%.
# &2 es el verde opaco y &4 el rojo opaco.
"Login & Logout messages":
  enabled: true
  login: "&2+ %player%"
  logout: "&4- %player%"

# Marcador. /dreamers scoreboard_info lo oculta o lo muestra.
# La elección de quien lo oculta queda en hidden.
scoreboard:
  title: "&a🛜&f%ping% &d🎮&l%player%"
  lines:
    - "&b💡&f%player_light_level% &b⏰&f%player_world_time_24% &c☠&f%objective_score_{deaths}%"
    - "&eClaimBL.: &r%dreamers_remainingclaims%"
    - "&eZona de %dreamers_currentclaim_ownername%"
    - ""
    - "&c☠&b%objective_scorepos_{deaths}_{1}% &r%objective_entrypos_{deaths}_{1}%"
    - "&c☠&b%objective_scorepos_{deaths}_{2}% &r%objective_entrypos_{deaths}_{2}%"
    - "&c☠&b%objective_scorepos_{deaths}_{3}% &r%objective_entrypos_{deaths}_{3}%"
    - "&c☠&b%objective_scorepos_{deaths}_{4}% &r%objective_entrypos_{deaths}_{4}%"
    - "&c☠&b%objective_scorepos_{deaths}_{5}% &r%objective_entrypos_{deaths}_{5}%"
    - "&c☠&b%objective_scorepos_{deaths}_{6}% &r%objective_entrypos_{deaths}_{6}%"
  hidden: []
