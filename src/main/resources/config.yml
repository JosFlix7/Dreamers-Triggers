# El modo UHC por muerte. /dreamers DeathUCH lo cambia y guarda estos valores.
death-uhc:
  enabled: false
  seconds: 60

# Comandos que puede usar quien no es op y no tiene dreamers.commands.bypass.
# El tabulador solo ofrece estos. El nombre va sin la barra.
# Un subcomando se escribe aparte: dreamers armor solo deja ese.
# minecraft:tell cuenta como tell. blocked acepta códigos de color &.
commands:
  allowed:
    - tell
    - msg
    - me
    - abandonclaim
    - unclaim
    - trust
    - untrust
    - containertrust
    - accesstrust
    - permissiontrust
    - unlockdrops
    - abandonallclaims
    - givepet
    - trustlist
    - dreamers armor
  blocked: "&cEste comando está bloqueado."

# Visibilidad de la armadura. true se ve y false se oculta.
# /dreamers armor <true|false> cambia la propia. Un operador puede indicar el jugador.
# Con la armadura oculta, al recibir daño se ve durante 5 segundos.
armor:
  players: {}

# Xaero's Minimap. Los allow-* valen para quien no tiene regla propia.
# level-id identifica el servidor ante el mod; no lo cambies.
# /dreamers xm <jugador> <cuevas> <cuevasNether> <radar> guarda true o false para ese jugador.
xaero:
  allow-cave-mode: true
  allow-nether-cave-mode: true
  allow-radar: true

# Fabric Mod Whitelist. Con enabled en true solo entra un operador o un cliente de Clients.
# Check mods revisa la lista de esos clientes: sale quien no la manda o trae un mod que no está admitido.
# La versión no importa y no hace falta traerlos todos.
# minecraft, java, fabricloader y mixinextras se admiten siempre.
# Los mods empaquetados dentro de otro jar no se revisan.
# dreamers-mod-sender tiene que quedarse: es el mod que manda la lista.
fabric-mod-whitelist:
  enabled: true
  # Clients
  clients:
    - vanilla
    - fabric
    - horizon
  # Check mods
  check-mods:
    - fabric
  # Mods admitidos
  allowed:
    - appleskin
    - architectury
    - badoptimizations
    - betterf3
    - c2me
    - chat_heads
    - cloth-config
    - clumps
    - continuity
    - dreamers-mod-sender
    - entityculling
    - fabric-api
    - ferritecore
    - immediatelyfast
    - inventoryhud
    - iris
    - librarian-trade-finder
    - lithium
    - logical_zoom
    - lss
    - modmenu
    - moreculling
    - reeses-sodium-options
    - renderscale
    - roughlyenoughitems
    - scalablelux
    - shulkerboxtooltip
    - sodium
    - sodium-extra
    - vmp
    - voicechat
    - voxy
    - xaerominimap
    - xaeroworldmap
