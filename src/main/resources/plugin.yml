name: DreamersTriggers
version: '1.6'
author: JosFlix7
main: dev.dreamers.DreamersPlugin
api-version: '26.3'
softdepend: [DiscordSRV]
description: Dreamers Triggers
commands:
  dreamers:
    description: Configura Dreamers Triggers
    usage: /dreamers DeathUCH <on|off|time> | /dreamers reload | /dreamers xm <jugador> <cuevas> <cuevasNether> <radar>
    permission: dreamers.deathuhc
    permission-message: No puedes usar este comando.
permissions:
  dreamers.deathuhc:
    description: Activa el modo UHC cuando muere un jugador y recarga la configuración
    default: op
  dreamers.commands.bypass:
    description: Usar y ver en el tabulador cualquier comando
    default: op
