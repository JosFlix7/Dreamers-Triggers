name: DreamersTriggers
version: '1.4.2'
author: JosFlix7
main: dev.dreamers.DreamersPlugin
api-version: '26.3'
softdepend: [DiscordSRV]
description: Dreamers Triggers
commands:
  dreamers:
    description: Configura el modo UHC por muerte
    usage: /dreamers DeathUCH <on|off|time>
    permission: dreamers.deathuhc
    permission-message: No puedes usar este comando.
permissions:
  dreamers.deathuhc:
    description: Activa el modo UHC cuando muere un jugador
    default: op
